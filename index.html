<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Seu ritmo. Seu treino. Timer de intervalos com contagem com bipes.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <title>Timer</title>
</head>
<body>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <span class="eyebrow">CONFIRMAÇÃO</span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-description"></p>
      <div class="dialog-actions"><button value="cancel" class="button secondary">Cancelar</button><button value="confirm" class="button primary">Confirmar</button></div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
